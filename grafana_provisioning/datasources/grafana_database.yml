# ./provisioning/datasources/postgres-db.yml
apiVersion: 1

datasources:
  - name: Grafana Database (PostgreSQL)
    uid: postgres-grafana
    type: postgres
    url: postgres:5432
    # Column-level read-only role (AD-14); the Grafana server role `grafana` only owns grafana_schema.
    user: grafana_reader
    access: proxy
    isDefault: false 
    version: 4
    editable: false
    jsonData:
      # Host is the Docker service name, port is the default 5432
      host: 
      port: 5432
      database: heart360tk_database
      # Use a secure connection if needed, but 'disable' is common for Docker environments
      sslmode: disable
      searchPath: grafana_schema,public
      # Postgres plugin requires this for time series
      timescaledb: false
      maxOpenConns: 100
      maxIdleConns: 2
      maxIdleConnsLifetime: 14400
      pool: true
      # Settings for the time column and schema visibility
      timeseries: true
      timeInterval: 
      intVal: true
    secureJsonData:
      # Password must be stored securely
      password: grafana_reader_mvp
